<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit saved ayah</title>

<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=Inter:wght@400;500;600&amp;family=Amiri:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.root{--body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--ar:'Amiri','Noto Naskh Arabic','Geeza Pro',serif;--display:'Newsreader','Iowan Old Style',Georgia,serif;position:relative;overflow:hidden;width:390px;box-sizing:border-box;font-family:var(--body);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.4;background:radial-gradient(130% 46% at 100% 0%,var(--glow),transparent 62%),var(--bg)}
.root *{box-sizing:border-box}
.root.pal-emerald.light{--bg:#FAFAF7;--surface:#FFFFFF;--surface2:#F6F7F3;--hair:rgba(30,36,32,0.09);--hair2:rgba(30,36,32,0.17);--text:#1E2420;--text2:#69716B;--muted:#6B736D;--em:#176B55;--em-text:#176B55;--em-wash:rgba(23,107,85,0.09);--gold:#B68F43;--gold-text:#866931;--gold-wash:rgba(214,168,79,0.14);--danger:#B04B38;--feat-a:#1E735D;--feat-b:#103F33;--feat-text2:#DEE7E2;--glow:rgba(23,107,85,0.09);--shadow:0 10px 26px rgba(20,36,30,0.1);--dock:rgba(255,255,255,0.88);--scrim:rgba(20,36,30,0.42)}
.root.pal-emerald.dark{--bg:#07110E;--surface:#111A17;--surface2:#17211E;--hair:rgba(243,247,244,0.1);--hair2:rgba(243,247,244,0.2);--text:#F3F7F4;--text2:#B8C2BC;--muted:#83908A;--em:#1E7A61;--em-text:#7ED6B2;--em-wash:rgba(126,214,178,0.1);--gold:#D6A84F;--gold-text:#DCB569;--gold-wash:rgba(214,168,79,0.12);--danger:#E69A8B;--feat-a:#145F4D;--feat-b:#0B342A;--feat-text2:#C5D5CD;--glow:rgba(30,122,97,0.2);--shadow:0 14px 34px rgba(0,0,0,.40);--dock:rgba(17,26,23,0.84);--scrim:rgba(0,0,0,.62)}
.root.pal-blue.light{--bg:#F6F9FE;--surface:#FFFFFF;--surface2:#EEF4FC;--hair:rgba(22,34,50,0.09);--hair2:rgba(22,34,50,0.17);--text:#162232;--text2:#616F82;--muted:#627083;--em:#1C63A7;--em-text:#1C63A7;--em-wash:rgba(28,99,167,0.09);--gold:#B29046;--gold-text:#826833;--gold-wash:rgba(216,174,85,0.14);--danger:#B04B38;--feat-a:#123D73;--feat-b:#0A223F;--feat-text2:#C5D5CD;--glow:rgba(28,99,167,0.09);--shadow:0 10px 26px rgba(16,34,56,0.1);--dock:rgba(255,255,255,0.88);--scrim:rgba(16,34,56,0.42)}
.root.pal-blue.dark{--bg:#06101C;--surface:#101B28;--surface2:#172638;--hair:rgba(244,248,252,0.1);--hair2:rgba(244,248,252,0.2);--text:#F4F8FC;--text2:#B9C6D5;--muted:#8493A5;--em:#1D5E9C;--em-text:#8EC9F4;--em-wash:rgba(142,201,244,0.1);--gold:#D8AE55;--gold-text:#DEBA6E;--gold-wash:rgba(216,174,85,0.12);--danger:#E69A8B;--feat-a:#123D73;--feat-b:#0A223F;--feat-text2:#C5D5CD;--glow:rgba(59,141,214,0.2);--shadow:0 14px 34px rgba(0,0,0,.40);--dock:rgba(16,27,40,0.84);--scrim:rgba(0,0,0,.62)}
.root.pal-purple.light{--bg:#FAF7FE;--surface:#FFFFFF;--surface2:#F3EFFB;--hair:rgba(38,27,52,0.09);--hair2:rgba(38,27,52,0.17);--text:#261B34;--text2:#74677F;--muted:#766981;--em:#6C3BAA;--em-text:#6C3BAA;--em-wash:rgba(108,59,170,0.09);--gold:#B1904A;--gold-text:#816936;--gold-wash:rgba(215,175,90,0.14);--danger:#B04B38;--feat-a:#3D236C;--feat-b:#22133B;--feat-text2:#C5D5CD;--glow:rgba(108,59,170,0.09);--shadow:0 10px 26px rgba(30,20,43,0.1);--dock:rgba(255,255,255,0.88);--scrim:rgba(30,20,43,0.42)}
.root.pal-purple.dark{--bg:#100A19;--surface:#1A1225;--surface2:#251A34;--hair:rgba(248,244,252,0.1);--hair2:rgba(248,244,252,0.2);--text:#F8F4FC;--text2:#CABED6;--muted:#9B8DA7;--em:#6F43AE;--em-text:#C7A7F4;--em-wash:rgba(199,167,244,0.1);--gold:#D7AF5A;--gold-text:#DDBB73;--gold-wash:rgba(215,175,90,0.12);--danger:#E69A8B;--feat-a:#40206F;--feat-b:#23123D;--feat-text2:#C5D5CD;--glow:rgba(147,104,208,0.2);--shadow:0 14px 34px rgba(0,0,0,.40);--dock:rgba(26,18,37,0.84);--scrim:rgba(0,0,0,.62)}
.root.pal-sepia.light{--bg:#F8F1E6;--surface:#FFFAF1;--surface2:#F0E3CF;--hair:rgba(45,33,23,0.09);--hair2:rgba(45,33,23,0.17);--text:#2D2117;--text2:#716452;--muted:#716452;--em:#8B5E2E;--em-text:#885C2D;--em-wash:rgba(139,94,46,0.09);--gold:#B28A40;--gold-text:#83652F;--gold-wash:rgba(209,162,75,0.14);--danger:#A74735;--feat-a:#5E371B;--feat-b:#341E0F;--feat-text2:#C5D5CD;--glow:rgba(139,94,46,0.09);--shadow:0 10px 26px rgba(42,27,16,0.1);--dock:rgba(255,250,241,0.88);--scrim:rgba(42,27,16,0.42)}
.root.pal-sepia.dark{--bg:#130E09;--surface:#1E1710;--surface2:#2A2016;--hair:rgba(255,248,236,0.1);--hair2:rgba(255,248,236,0.2);--text:#FFF8EC;--text2:#D0C0A9;--muted:#A3947E;--em:#8E5E2F;--em-text:#E0B874;--em-wash:rgba(224,184,116,0.1);--gold:#D8AE55;--gold-text:#DEBA6E;--gold-wash:rgba(216,174,85,0.12);--danger:#E69A8B;--feat-a:#4F2F19;--feat-b:#2B1A0E;--feat-text2:#C5D5CD;--glow:rgba(192,138,76,0.2);--shadow:0 14px 34px rgba(0,0,0,.40);--dock:rgba(30,23,16,0.84);--scrim:rgba(0,0,0,.62)}
.root.pal-red.light{--bg:#FCF7F7;--surface:#FFFFFF;--surface2:#F6EEEE;--hair:rgba(49,25,31,0.09);--hair2:rgba(49,25,31,0.17);--text:#31191F;--text2:#75636A;--muted:#7A686F;--em:#8E1F35;--em-text:#8E1F35;--em-wash:rgba(142,31,53,0.09);--gold:#B29046;--gold-text:#826833;--gold-wash:rgba(216,174,85,0.14);--danger:#B04B38;--feat-a:#4D111F;--feat-b:#2A0911;--feat-text2:#C5D5CD;--glow:rgba(142,31,53,0.09);--shadow:0 10px 26px rgba(45,15,23,0.1);--dock:rgba(255,255,255,0.88);--scrim:rgba(45,15,23,0.42)}
.root.pal-red.dark{--bg:#12070A;--surface:#1F1014;--surface2:#2B171D;--hair:rgba(255,246,248,0.1);--hair2:rgba(255,246,248,0.2);--text:#FFF6F8;--text2:#D2BDC4;--muted:#A48B94;--em:#C8475D;--em-text:#E38CA0;--em-wash:rgba(227,140,160,0.1);--gold:#D8AE55;--gold-text:#DEBA6E;--gold-wash:rgba(216,174,85,0.12);--danger:#E69A8B;--feat-a:#4E111F;--feat-b:#2B0911;--feat-text2:#C5D5CD;--glow:rgba(200,71,93,0.2);--shadow:0 14px 34px rgba(0,0,0,.40);--dock:rgba(31,16,20,0.84);--scrim:rgba(0,0,0,.62)}
.root.pal-black.dark{--bg:#000000;--surface:#070807;--surface2:#111312;--hair:rgba(245,248,247,0.1);--hair2:rgba(245,248,247,0.2);--text:#F5F8F7;--text2:#BEC7C4;--muted:#7E8885;--em:#0E6C60;--em-text:#83D8CC;--em-wash:rgba(131,216,204,0.1);--gold:#D3A84E;--gold-text:#DAB569;--gold-wash:rgba(211,168,78,0.12);--danger:#E69A8B;--feat-a:#060807;--feat-b:#030404;--feat-text2:#C5D5CD;--glow:rgba(0,0,0,0);--shadow:0 14px 34px rgba(0,0,0,.40);--dock:rgba(7,8,7,0.84);--scrim:rgba(0,0,0,.62)}
.pad{padding:0 20px}
.top{padding-top:64px}
.t-title{font:500 36px/1.08 var(--display);letter-spacing:-.015em;margin:0;font-feature-settings:'lnum'}
.t-h2{font:500 24px/1.15 var(--display);letter-spacing:-.01em;margin:0;font-feature-settings:'lnum'}
.t-num{font-family:var(--display);font-feature-settings:'lnum','tnum';font-weight:500;letter-spacing:-.01em}
.eyebrow{font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-text)}
.sub{margin:8px 0 0;font-size:14px;color:var(--muted)}
.muted{color:var(--muted)}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hbtns{display:flex;gap:10px;padding-top:2px}
.ibtn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--hair);color:var(--text2);padding:0;cursor:pointer;flex:none;font:inherit}
.ibtn.ghost{background:transparent;border-color:transparent}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:24px}
.orn{display:flex;align-items:center;gap:12px}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--hair2))}
.orn i:last-child{background:linear-gradient(270deg,transparent,var(--hair2))}
.orn b{width:6px;height:6px;transform:rotate(45deg);background:var(--gold);opacity:.85;display:block}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:36px 0 14px}
.sechead a{font-size:13px;font-weight:500;color:var(--em-text);text-decoration:none}
.btn{height:48px;padding:0 22px;border-radius:16px;border:0;font:600 15px var(--body);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--em);color:#fff}
.btn.gold{background:var(--gold);color:#1B1406}
.btn.ghost{background:transparent;border:1px solid var(--hair2);color:var(--text)}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--hair);background:transparent;color:var(--text2);font:500 13px var(--body);display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;flex:none}
.chip em{font-style:normal;color:var(--muted);font-size:12px}
.chip.on{background:var(--em-wash);border-color:var(--hair2);color:var(--em-text)}
.search{display:flex;align-items:center;gap:12px;height:52px;padding:0 16px;border-radius:18px;background:var(--surface);border:1px solid var(--hair);color:var(--muted)}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;font:400 15px var(--body);color:var(--text)}
.search input::placeholder{color:var(--muted);opacity:1}
.dock{position:absolute;left:14px;right:14px;top:760px;height:72px;border-radius:28px;background:var(--dock);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--hair2);box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(5,1fr);padding:6px;gap:2px;z-index:5}
.dock a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:22px;color:var(--muted);font-size:11px;font-weight:500;text-decoration:none}
.dock a.on{background:var(--em-wash);color:var(--em-text)}
.feat{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(155deg,var(--feat-a),var(--feat-b));color:#F3F7F4;border:1px solid rgba(226,188,107,.22)}
.rail{display:flex;gap:10px;margin:0 -20px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--hair)}
.tab{position:relative;height:48px;background:transparent;border:0;color:var(--muted);font:500 15px var(--body);cursor:pointer}
.tab.on{color:var(--text)}
.tab.on::after{content:'';position:absolute;left:50%;bottom:-1px;width:32px;height:2px;margin-left:-16px;border-radius:2px;background:var(--gold)}
.pillx{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid var(--hair);color:var(--text2);white-space:nowrap}
.pillx.gold{background:var(--gold-wash);border-color:transparent;color:var(--gold-text)}
.medal{position:relative;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;flex:none;color:var(--gold)}
.medal em{position:absolute;font:500 13px var(--display);font-style:normal;color:var(--text);font-feature-settings:'lnum'}
</style>
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>


<div class="root pal-emerald light" style="width:390px;height:844px;--display:'Newsreader','Iowan Old Style',Georgia,serif">


<div class="pad top">
  <header class="pagehead">
    <h1 class="t-title">Quran</h1>
    <div class="hbtns"><button class="ibtn" aria-label="Search the Quran"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></button></div>
  </header>
</div>
<div class="pad" style="margin-top:18px"><nav class="tabs" aria-label="Quran sections"><button class="tab">Surahs</button><button class="tab">Juz</button><button class="tab">Pages</button><button class="tab on">Saved</button></nav></div>
<div class="pad" style="margin-top:26px;opacity:.55">
  <div class="eyebrow">Personal library</div><h2 class="t-h2" style="margin-top:10px;font-size:30px">24 saved ayahs</h2>
  <div class="card" style="margin-top:20px;height:260px"></div>
</div>
<div style="position:absolute;inset:0;background:var(--scrim);z-index:6"></div>
<section aria-label="Edit saved ayah" style="position:absolute;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-radius:32px 32px 0 0;border-top:1px solid var(--hair2);box-shadow:0 -18px 50px rgba(0,0,0,.35);padding:12px 20px 28px">
  <div style="width:40px;height:4px;border-radius:4px;background:var(--hair2);margin:0 auto 16px"></div>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
    <div style="display:flex;align-items:center;gap:10px"><span class="medal"><svg viewBox="0 0 30 30" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="5.5" y="5.5" width="19" height="19" rx="2.2"/><rect x="5.5" y="5.5" width="19" height="19" rx="2.2" transform="rotate(45 15 15)"/></svg><em>2</em></span><div><div style="font-size:16px;font-weight:600">Al-Baqarah</div><div class="muted" style="font-size:12.5px">Ayah 286</div></div></div>
    <button class="ibtn ghost" aria-label="Close"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.500 6.500 11 11M17.500 6.500l-11 11"/></svg></button>
  </div>
  <p class="ar " dir="rtl" lang="ar" style="font:400 24px/1.9 var(--ar);margin:0;text-align:right;margin-top:4px">لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا وُسْعَهَا</p>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:14px 16px;border-radius:18px;background:var(--surface2);border:1px solid var(--hair)">
    <span style="display:flex;align-items:center;gap:12px;font-size:15px;font-weight:500;color:var(--text)"><span style="color:var(--gold)"><svg viewBox="0 0 24 24" width="21" height="21" fill="var(--gold)" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.3A4.3 4.3 0 0 1 12 7.1a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20Z"/></svg></span>Favourite</span>
    <span role="img" aria-label="On" style="width:48px;height:28px;border-radius:999px;background:var(--em);padding:3px;display:flex;justify-content:flex-end"><span style="width:22px;height:22px;border-radius:50%;background:#fff;display:block"></span></span>
  </div>
  <label style="display:block;margin-top:16px"><span class="eyebrow">Private note</span>
    <textarea rows="3" style="display:block;width:100%;margin-top:9px;padding:13px 14px;border-radius:16px;border:1px solid var(--hair2);background:var(--surface2);color:var(--text);font:400 15px/1.5 var(--body);resize:none;outline:0">For the hard days. Nothing is asked of me that I cannot carry.</textarea></label>
  <div style="margin-top:16px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="eyebrow">Folder</span><a href="#" style="font-size:13px;font-weight:500;color:var(--em-text);text-decoration:none">Manage folders</a></div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px"><button class="chip">Unsorted</button><button class="chip on"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5.5 12.5 4.2 4.2 8.8-9.4"/></svg>Gratitude</button><button class="chip">Duas</button><button class="chip" style="border-style:dashed"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg>New folder</button></div></div>
  <label style="display:block;margin-top:16px"><span class="eyebrow">Tags</span>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:9px;min-height:50px;padding:8px 12px;border-radius:16px;border:1px solid var(--hair2);background:var(--surface2)">
      <span class="pillx">#patience <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.500 6.500 11 11M17.500 6.500l-11 11"/></svg></span><span class="pillx">#hope <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.500 6.500 11 11M17.500 6.500l-11 11"/></svg></span><input type="text" placeholder="gratitude, duas" aria-label="Add tags" style="flex:1;min-width:90px;background:transparent;border:0;outline:0;color:var(--text);font:400 14px var(--body)"></div></label>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-top:22px">
    <button class="btn ghost" style="color:var(--danger);border-color:transparent;padding:0 6px"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7.5h14M9.5 7.5v-3h5v3M7 7.5l.9 12h8.2l.9-12"/></svg>Delete</button>
    <button class="btn pri" style="min-width:150px">Save</button>
  </div>
</section>
</div>


</body>
</html>
