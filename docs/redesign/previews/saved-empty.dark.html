.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}

.ibtn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--hair);color:var(--text2);padding:0;cursor:pointer;flex:none;font:inherit}
.ibtn.ghost{background:transparent;border-color:transparent}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:24px}
.orn{display:flex;align-items:center;gap:12px}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--hair2))}
.orn i:last-child{background:linear-gradient(270deg,transparent,var(--hair2))}
.orn b{width:6px;height:6px;transform:rotate(45deg);background:var(--gold);opacity:.85;display:block}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:36px 0 14px}
.sechead a{font-size:13px;font-weight:500;color:var(--em-text);text-decoration:none}
.btn{height:48px;padding:0 22px;border-radius:16px;border:0;font:600 15px var(--body);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--em);color:#fff}
.btn.gold{background:var(--gold);color:#1B1406}
.btn.ghost{background:transparent;border:1px solid var(--hair2);color:var(--text)}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--hair);background:transparent;color:var(--text2);font:500 13px var(--body);display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;flex:none}
.chip em{font-style:normal;color:var(--muted);font-size:12px}
.chip.on{background:var(--em-wash);border-color:var(--hair2);color:var(--em-text)}
.search{display:flex;align-items:center;gap:12px;height:52px;padding:0 16px;border-radius:18px;background:var(--surface);border:1px solid var(--hair);color:var(--muted)}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;font:400 15px var(--body);color:var(--text)}
.search input::placeholder{color:var(--muted);opacity:1}
.dock{position:absolute;left:14px;right:14px;top:760px;height:72px;border-radius:28px;background:var(--dock);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--hair2);box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(5,1fr);padding:6px;gap:2px;z-index:5}
.dock a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:22px;color:var(--muted);font-size:11px;font-weight:500;text-decoration:none}
.dock a.on{background:var(--em-wash);color:var(--em-text)}
.feat{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(155deg,var(--feat-a),var(--feat-b));color:#F3F7F4;border:1px solid rgba(226,188,107,.22)}
.rail{display:flex;gap:10px;margin:0 -20px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--hair)}
.tab{position:relative;height:48px;background:transparent;border:0;color:var(--muted);font:500 15px var(--body);cursor:pointer}
.tab.on{color:var(--text)}
.tab.on::after{content:'';position:absolute;left:50%;bottom:-1px;width:32px;height:2px;margin-left:-16px;border-radius:2px;background:var(--gold)}
.pillx{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid var(--hair);color:var(--text2);white-space:nowrap}
.pillx.gold{background:var(--gold-wash);border-color:transparent;color:var(--gold-text)}
.medal{position:relative;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;flex:none;color:var(--gold)}
.medal em{position:absolute;font:500 13px var(--display);font-style:normal;color:var(--text);font-feature-settings:'lnum'}
