flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/media/images/icon.png"
  adaptive_icon_background: "assets/media/images/icon_background.png"
  adaptive_icon_foreground: "assets/media/images/icon_foreground.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/media/images/icon.png"
    background_color: "#1E735D"
    theme_color: "#1E735D"
  windows:
    generate: true
    image_path: "assets/media/images/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/media/images/icon.png"

