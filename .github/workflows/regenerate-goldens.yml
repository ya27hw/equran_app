name: Regenerate goldens (Linux)

# Runs on pushes to a regen/ branch. Rebuilds the golden images on the same Linux runner that the
# quality job uses, so the committed goldens match CI rendering. The images
# are uploaded as an artifact; copy them into the repo and commit.

on:
  push:
    branches:
      - 'regen/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Regenerate goldens
        # Tests that fail for other reasons still write their goldens.
        run: flutter test --update-goldens || true

      - name: Pack goldens
        run: find test -path '*/goldens/*' -name '*.png' | tar -czf linux-goldens.tgz -T -

      - uses: actions/upload-artifact@v4
        with:
          name: linux-goldens
          path: linux-goldens.tgz
          retention-days: 7
