name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.1.5

      - uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter build web --release --dart-define=FLUTTER_WEB_RENDERER=canvaskit --base-href=/app/

      - name: Stage app under /app/
        run: |
          mkdir -p build/web/app
          for item in build/web/*; do
            [ "$(basename "$item")" = "app" ] || mv "$item" build/web/app/
          done

      - name: Copy landing page to root
        run: cp -r landing/* build/web/

      - name: Create CNAME file
        run: echo 'quran.elbaesy.com' > build/web/CNAME

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
